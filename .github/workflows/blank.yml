name: run R code to make objects for dashboard

on:
  workflow_dispatch:

jobs:
  run-r-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
       
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
         
      - name: Install dependencies
        run: |
          install.packages(c("devtools","scales","dplyr","poibin","tidyr","ggplot2","DT"))
        shell: Rscript {0}
        
      - name: run code
        env:
          GITHUB_PAT: ${{ secrets.CFBD_API_KEY }}
        run: Rscript Rscript.R

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add *.RData
          git diff-index --quiet HEAD || git commit -m "Automated dashboard object update [skip ci]"
          git push origin main
